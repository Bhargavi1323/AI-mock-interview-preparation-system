<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Mock Interview</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <div class="container">

        <h1>🤖 AI Mock Interview</h1>

        <p>Practice your interview and improve your answers.</p>


        <!-- START SECTION -->

        <div id="startSection">

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
            >

            <input
                type="text"
                id="role"
                placeholder="Enter job role"
            >

            <button onclick="startInterview()">
                Start Interview
            </button>

        </div>


        <!-- INTERVIEW SECTION -->

        <div id="interviewSection" style="display:none;">

            <h2 id="question"></h2>

            <textarea
                id="answer"
                placeholder="Type your answer here..."
            ></textarea>

            <button onclick="submitAnswer()">
                Submit Answer
            </button>

            <div id="result"></div>

            <button
                id="nextButton"
                onclick="nextQuestion()"
                style="display:none;"
            >
                Next Question
            </button>

        </div>


        <!-- FINAL SECTION -->

        <div id="finalSection" style="display:none;">

            <h2>🎉 Interview Completed!</h2>

            <p id="finalMessage"></p>

            <button onclick="location.reload()">
                Start Again
            </button>

        </div>

    </div>


<script>

let currentQuestion = 0;
let totalScore = 0;
let answered = false;


function startInterview() {

    let name = document.getElementById("name").value;
    let role = document.getElementById("role").value;

    if (name === "" || role === "") {

        alert("Please enter your name and job role.");

        return;
    }

    document.getElementById("startSection").style.display = "none";

    document.getElementById("interviewSection").style.display = "block";

    loadQuestion();
}


function loadQuestion() {

    answered = false;

    document.getElementById("answer").value = "";

    document.getElementById("result").innerHTML = "";

    document.getElementById("nextButton").style.display = "none";


    fetch("/get_question/" + currentQuestion)

        .then(response => response.json())

        .then(data => {

            document.getElementById("question").innerText =
                "Question " +
                (currentQuestion + 1) +
                ": " +
                data.question;

        });
}


function submitAnswer() {

    if (answered) {
        return;
    }

    let answer =
        document.getElementById("answer").value;


    if (answer.trim() === "") {

        alert("Please enter your answer.");

        return;
    }


    fetch("/evaluate", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            answer: answer
        })

    })

    .then(response => response.json())

    .then(data => {

        answered = true;

        totalScore += data.score;


        document.getElementById("result").innerHTML =

            "<h3>Score: " +
            data.score +
            "/10</h3>" +

            "<p><b>Feedback:</b> " +
            data.feedback +
            "</p>";


        document.getElementById("nextButton")
            .style.display = "inline-block";

    });
}


function nextQuestion() {

    currentQuestion++;

    if (currentQuestion >= 5) {

        finishInterview();

    } else {

        loadQuestion();

    }
}


function finishInterview() {

    document.getElementById("interviewSection")
        .style.display = "none";

    document.getElementById("finalSection")
        .style.display = "block";


    let average = totalScore / 5;


    document.getElementById("finalMessage").innerText =

        "Your final score is " +
        average.toFixed(1) +
        "/10. Keep practicing!";

}

</script>

</body>
</html>
